name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.14.6
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Show Python version
        shell: pwsh
        run: python --version

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Development harness smoke check
        shell: pwsh
        run: .\scripts\check_harness.ps1 -Scenario harness

      - name: Python syntax check
        shell: pwsh
        run: python -m compileall -q app.py src tests scripts

      - name: Text hygiene check
        shell: pwsh
        run: python scripts/check_text_hygiene.py

      - name: Public tracked-tree safety check
        shell: pwsh
        run: python scripts/check_public_readiness.py --tracked-only

      - name: Pytest
        shell: pwsh
        run: |
          $pytestTemp = Join-Path $env:RUNNER_TEMP "content-trend-tracker-pytest"
          if (Test-Path $pytestTemp) {
            Remove-Item -Recurse -Force $pytestTemp
          }
          python -m pytest -q -p no:cacheprovider "--basetemp=$pytestTemp"
